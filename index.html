<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyLab — Flashcards, Learn &amp; Test</title>
<meta name="description" content="A fast, private, offline-first study app with Flashcards, Learn, Test and Match modes. Your sets stay in your browser.">
<meta name="color-scheme" content="light dark">
<!-- Only applies when the page has been added to the Home Screen, where iOS
     paints the status bar itself and ignores theme-color. "black-translucent"
     hands that strip back to the page, so it shows the app's own background;
     .topbar then insets itself by the safe area. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- One ungated theme-color, owned by the script below and then by theme.js.
     Media-gated copies cannot work here: the chosen theme lives in IndexedDB,
     which resolves long after first paint, so a dark app on a light phone got
     the light bar and kept it. -->
<meta name="theme-color" content="#f6f6f9">

<!-- Runs before the first paint. The real preference is in IndexedDB, so
     theme.js mirrors it into localStorage for this script to read back on the
     next visit — which settles both the status bar and the theme itself
     before anything is drawn, instead of flashing the wrong one. -->
<script>
(function () {
  var BG = { light: '#f6f6f9', dark: '#13151b' };   // the two --c-bg values
  var pref = 'system';
  try { pref = localStorage.getItem('studylab:theme') || 'system'; } catch (e) {}
  var theme = pref === 'light' || pref === 'dark' ? pref
    : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = theme;
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', BG[theme]);
})();
</script>
