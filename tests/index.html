/* Browser test suite. Open /tests/ on any local server (or the live site).
   Pure logic only — it never touches your saved sets. */
const out = document.getElementById('out');
const results = [];
function test(name, fn) { results.push({ name, fn }); }
const eq = (a, b, msg) => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${msg || ''} expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); };
const ok = (v, msg) => { if (!v) throw new Error(msg || 'expected truthy'); };

const MODULES = ['utils','ui','data','storage','router','theme','grading','scheduler','speech','importers','share','qr','celebrate','mascot',
  'views/library','views/setview','views/editor','views/flashcards','views/learn','views/test','views/match',
  'views/importview','views/settings','views/shared','views/dialogs','views/options','views/streak'];

test('every module loads', async () => {
  const fails = [];
  for (const m of MODULES) { try { await import(`../js/${m}.js`); } catch (e) { fails.push(`${m}: ${e.message}`); } }
  eq(fails, [], 'module failures:');
});

test('service worker precaches only files that exist', async () => {
  const sw = await (await fetch('../sw.js', { cache: 'no-store' })).text();
  const files = [...sw.matchAll(/'([^']+\.(?:js|css|html))'/g)].map(m => m[1]);
  ok(files.length > 20, 'shell list looks empty');
  const missing = [];
  for (const f of files) { const r = await fetch('../' + f, { cache: 'no-store' }); if (!r.ok) missing.push(f); }
  eq(missing, []);
});

test('grading: smart matching', async () => {
  const { grade } = await import('../js/grading.js');
  const r = (u, e, o) => { const x = grade(u, e, o || {}); return x.correct ? 'correct' : x.close ? 'close' : 'wrong'; };
  eq(r('the Mitochondria', 'mitochondria'), 'correct');
  eq(r('cafe', 'café'), 'correct');
  eq(r('its a test', "It's a test"), 'correct');
  eq(r('kitty', 'cat / kitty'), 'correct');
  eq(r('run', '(to) run'), 'correct');
  eq(r('measures fitness difference between a genotype and most fit genotype',
       'measures fitness difference between a genotype and the most fit genotype'), 'correct', 'mid-sentence article');
  eq(r('mitochondrian', 'mitochondrion'), 'close');
  eq(r('measures how big a population is', 'measures fitness difference between a genotype and the most fit genotype'), 'wrong', 'long wrong answer must not be close');
  eq(r('dog', 'cat'), 'wrong');
  eq(r('', 'x'), 'wrong');
  eq(r('cafe', 'café', { requireExact: true }), 'wrong');
  eq(r('my own words', 'official definition text here', { accepted: ['my own words'] }), 'correct', 'remembered override');
});

test('grading: definitions in your own words (key ideas)', async () => {
  const { grade } = await import('../js/grading.js');
  const r = (u, e, o) => { const x = grade(u, e, o || {}); return x.correct ? 'correct' : x.keywords ? 'own words' : x.close ? 'close' : 'wrong'; };
  const def = 'measures fitness difference between a genotype and the most fit genotype';
  eq(r('difference in fitness between a genotype and the fittest genotype', def), 'own words');
  eq(r('controls what can enter and leave', 'controls what enters and leaves'), 'own words');
  eq(r('treaty that lowers trade barriers between nations', 'a treaty between nations that lowers barriers to trade'), 'own words');
  eq(r('the war ended in 1918 after germany surrendered', 'war that ended in 1918 with the surrender of germany'), 'own words');
  // must stay wrong
  eq(r('measures how big a population is', def), 'wrong', 'different idea');
  eq(r('cell', 'the powerhouse of the cell'), 'wrong', 'short answers need the real thing');
  eq(r('does not allow water to pass through the membrane', 'allows water to pass through the membrane'), 'wrong', 'negation flips meaning');
  eq(r('war started 1914 germany', 'war that ended in 1918 with the surrender of germany'), 'wrong');
  eq(r('dna rna protein cell nucleus mitochondria ribosome energy membrane enzyme gene', 'the nucleus holds the dna of the cell'), 'wrong', 'keyword dump');
  eq(r('controls what can enter and leave', 'controls what enters and leaves', { smart: false }), 'wrong', 'only with smart grading');
});

test('distractors never leak the answer or repeat', async () => {
  const { distractors } = await import('../js/grading.js');
  const pool = Array.from({ length: 500 }, (_, i) => `definition ${i}`);
  for (let i = 0; i < 200; i++) {
    const d = distractors(pool[i], pool, 3);
    eq(d.length, 3); ok(!d.includes(pool[i]), 'leaked answer'); eq(new Set(d).size, 3, 'duplicate');
  }
});

test('scheduler: override path reaches mastery', async () => {
  const { recordAnswer } = await import('../js/scheduler.js');
  const p = { cards: {} }, o = { masteryTarget: 2 };
  recordAnswer(p, 't', true, o);                          // streak 1
  const before = { ...p.cards.t };
  recordAnswer(p, 't', false, o);                         // a miss resets…
  eq(p.cards.t.streak, 0);
  p.cards.t = { ...before };                              // …"I was right" rolls back
  recordAnswer(p, 't', true, o);
  eq(p.cards.t.status, 'mastered');
});

test('scheduler: overrideAsCorrect rolls back the miss and remembers the wording', async () => {
  const { recordAnswer, ensureCard, overrideAsCorrect } = await import('../js/scheduler.js');
  const { grade } = await import('../js/grading.js');
  const p = { cards: {} }, o = { masteryTarget: 2 };
  recordAnswer(p, 't', true, o);
  const before = { ...ensureCard(p, 't') };
  recordAnswer(p, 't', false, o);
  const c = overrideAsCorrect(p, 't', before, '  energy factory of the cell ', o);
  eq([c.status, c.wrong, c.right], ['mastered', 0, 2]);
  eq(c.accepted, ['energy factory of the cell']);
  ok(grade('Energy factory of the cell', 'the powerhouse of the cell', { accepted: c.accepted }).correct, 'wording accepted next time');
  ok(grade('energy factory of the cell', 'the powerhouse of the cell', { requireExact: true, accepted: c.accepted }).correct, 'even with smart grading off');
});

test('test paper only uses the question types you turned on', async () => {
  const { makeQuestions } = await import('../js/views/test.js');
  const { mulberry32 } = await import('../js/utils.js');
  const terms = n => Array.from({ length: n }, (_, i) => ({ id: 't' + i, term: 'term ' + i, definition: 'definition ' + i }));
  const kindsOf = qs => [...new Set(qs.map(q => q.kind))].sort();
  const covered = qs => qs.reduce((n, q) => n + (q.kind === 'matching' ? q.terms.length : 1), 0);
  const all = ['written', 'multiple', 'truefalse', 'matching'];
  // every non-empty combination of types, several set sizes and seeds
  for (let mask = 1; mask < 16; mask++) {
    const types = Object.fromEntries(all.map((k, b) => [k, !!(mask & (1 << b))]));
    const on = all.filter(k => types[k]);
    for (const n of [2, 3, 4, 7, 12, 23]) {
      for (let seed = 1; seed <= 6; seed++) {
        const t = terms(n);
        const qs = makeQuestions(t, t, { types, answerWith: 'both' }, mulberry32(seed));
        eq(covered(qs), n, `every term asked once (${on}, n=${n})`);
        const stray = kindsOf(qs).filter(k => !on.includes(k));
        eq(stray, [], `types ${on} on, n=${n}, seed=${seed}:`);
      }
    }
  }
  // matching only: no written leftovers, groups balanced and never above five
  const sizes = n => makeQuestions(terms(n), terms(n), { types: { matching: true } }, mulberry32(1)).map(q => q.terms.length);
  eq(sizes(12), [4, 4, 4]); eq(sizes(7), [4, 3]); eq(sizes(5), [5]); eq(sizes(3), [3]);
  // turning matching on in a big set actually produces matching questions
  const t = terms(30);
  const mixed = makeQuestions(t, t, { types: { written: true, matching: true } }, mulberry32(3));
  ok(mixed.some(q => q.kind === 'matching'), 'matching appears when enabled');
});

test('tapping the words of a switch row flips the switch', async () => {
  const { checkboxRow, typeRows } = await import('../js/views/options.js');
  let v = false;
  const row = checkboxRow('Starred only', '', false, x => { v = x; });
  document.body.appendChild(row);
  row.querySelector('.opt-row__label').click();
  eq([v, row.querySelector('input').checked], [true, true]);
  row.querySelector('input').click();                 // the switch itself still works, once
  eq([v, row.querySelector('input').checked], [false, false]);
  row.remove();
  // "keep at least one type on" still applies when tapping the words
  let types = { written: true, matching: false };
  const rows = typeRows(types, [['written', 'Written'], ['matching', 'Matching']], x => { types = x; });
  rows.forEach(r => document.body.appendChild(r));
  rows[0].querySelector('.opt-row__label').click();
  ok(rows[0].querySelector('input').checked, 'last type cannot be turned off');
  rows[1].querySelector('.opt-row__text').click();
  rows[0].querySelector('.opt-row__label').click();
  eq(types, { written: false, matching: true });
  rows.forEach(r => r.remove());
});

test('QR codes: capacities, a scanner-verified matrix, and too-long links', async () => {
  const { encodeQR, capacity, MAX_QR_BYTES, qrSvg } = await import('../js/qr.js');
  eq([1, 10, 25, 40].map(v => [capacity(v, 'L'), capacity(v, 'M')]), [[17, 14], [271, 213], [1273, 997], [2953, 2331]], 'ISO 18004 byte capacities');
  eq(MAX_QR_BYTES, 2953);
  // This exact matrix was decoded successfully by an independent QR reader (jsQR).
  const text = 'https://fish2266.github.io/studylab/#/s/gH4sIAAAAAAAAA6tWKkktLlGyUkoqTVHSUcpLzE0F8pMSixRqAQB_test';
  const qr = encodeQR(text);
  let h = 2166136261; for (const row of qr.modules) for (const v of row) { h ^= v ? 1 : 0; h = Math.imul(h, 16777619) >>> 0; }
  eq([qr.version, qr.ecl, qr.size, h.toString(16)], [6, 'M', 41, 'a3d9916f']);
  // finder patterns in three corners
  const finder = (x, y) => [0, 6].every(d => qr.modules[y][x + d] && qr.modules[y + d][x]) && !qr.modules[y + 1][x + 1] && qr.modules[y + 3][x + 3];
  ok(finder(0, 0) && finder(qr.size - 7, 0) && finder(0, qr.size - 7), 'finder patterns');
  // longer text -> bigger version; drops to level L before giving up
  ok(encodeQR('x'.repeat(500)).version > qr.version);
  eq(encodeQR('x'.repeat(2400)).ecl, 'L');
  let threw = false; try { encodeQR('x'.repeat(3000)); } catch { threw = true; }
  ok(threw, 'over 2953 bytes must throw');
  const svg = qrSvg(qr); ok(svg.querySelector('path').getAttribute('d').length > 100, 'svg drawn');
});

test('streaks: counting days, gaps, and "not lost until tomorrow"', async () => {
  const { streakInfo, dayKey, addDays } = await import('../js/data.js');
  const now = new Date(2026, 10, 2, 15, 0);          // 2 Nov 2026, afternoon
  const d = (n) => dayKey(addDays(now, -n));
  const days = (...ns) => Object.fromEntries(ns.map(n => [d(n), 5]));
  eq(streakInfo({}, now).current, 0);
  eq(streakInfo(days(0, 1, 2), now).current, 3, 'today + 2 before');
  eq(streakInfo(days(1, 2, 3), now).current, 3, 'yesterday still counts before you study today');
  eq(streakInfo(days(1, 2, 3), now).studiedToday, false);
  eq(streakInfo(days(2, 3), now).current, 0, 'a missed day breaks it');
  const s = streakInfo(days(0, 10, 11, 12, 13, 20), now);
  eq([s.current, s.best, s.totalDays, s.today], [1, 4, 6, 5]);
  // across a month boundary and DST change (1 Nov in the US)
  eq(streakInfo(days(0, 1, 2, 3, 4), now).current, 5);
  eq(dayKey(new Date(2026, 0, 5)), '2026-01-05');
});

  const { heatmap, level } = await import('../js/views/streak.js');
  const { dayKey } = await import('../js/data.js');
  eq([0, 1, 9, 10, 29, 30, 59, 60, 500].map(level), [0, 1, 1, 2, 2, 3, 3, 4, 4]);
  const now = new Date(2026, 10, 2);

});

test('mastery celebration fires once per time a set becomes fully mastered', async () => {
  const { checkMastered } = await import('../js/celebrate.js');
  const set = { terms: [{ id: 'a', term: 'a', definition: '1' }, { id: 'b', term: 'b', definition: '2' }, { id: 'c', term: '', definition: '' }] };
  const p = { cards: { a: { status: 'mastered' }, b: { status: 'learning' } } };
  eq(checkMastered(set, p), false, 'not all mastered');
  p.cards.b.status = 'mastered';
  eq(checkMastered(set, p), true, 'blank cards are ignored');
  eq(checkMastered(set, p), false, 'only once');
  p.cards.b.status = 'learning';
  eq(checkMastered(set, p), false); ok(!p.masteredAt, 'slipping back clears it');
  p.cards.b.status = 'mastered';
  eq(checkMastered(set, p), true, 're-mastering celebrates again');
  eq(checkMastered({ terms: [] }, { cards: {} }), false, 'empty set never "mastered"');
});

test('Learn rounds ask every term once, even when all are in progress', async () => {
  const { buildRound } = await import('../js/scheduler.js');
  const terms = Array.from({ length: 5 }, (_, i) => ({ id: 't' + i }));
  const learning = { cards: Object.fromEntries(terms.map(t => [t.id, { status: 'learning', box: 0, wrong: 0, due: 0 }])) };
  const r = buildRound(terms, learning, { roundSize: 7 });
  eq(r.length, 5); eq(new Set(r).size, 5, 'no repeats');
  const r2 = buildRound(Array.from({ length: 20 }, (_, i) => ({ id: 'x' + i })), { cards: Object.fromEntries(Array.from({ length: 20 }, (_, i) => ['x' + i, { status: i < 12 ? 'learning' : 'new', box: 0, wrong: 0, due: 0 }])) }, { roundSize: 7 });
  eq([r2.length, new Set(r2).size], [7, 7]);
});

test('Flurry: melts further with every miss, refreezes with right answers', async () => {
  const { createMood, moodForScore, snowman, MAX_MELT } = await import('../js/mascot.js');
  const f = createMood();
  const faces = [], melts = [];
  for (let i = 0; i < 12; i++) { const r = f.react('wrong'); faces.push(r.face); melts.push(r.melt); ok(r.quip && !r.quip.includes('{n}'), 'quip filled in'); }
  eq(faces.slice(0, 8), ['worried', 'sad', 'cry', 'cry', 'sob', 'sob', 'puddle', 'puddle'], 'escalation');
  eq(melts.slice(0, 4), [1, 2, 3, 4]); eq(Math.max(...melts), MAX_MELT, 'capped');
  // recovery: first right after a meltdown gets a recovery line, melt goes down
  const back = f.react('right');
  eq(back.face, 'happy'); ok(back.melt < MAX_MELT);
  let r; for (let i = 0; i < 7; i++) r = f.react('right');
  eq([r.face, r.melt], ['party', 0], 'eight in a row: party, fully refrozen');
  eq(f.react('skip').face, 'think', '"don\'t know" is not punished');
  eq([0, 19, 20, 45, 70, 85, 100].map(p => moodForScore(p).face), ['puddle', 'puddle', 'cry', 'worried', 'happy', 'grin', 'party']);
  // drawings: valid markup for every state, puddle form when melted, help sign at the very end
  for (const face of ['happy', 'grin', 'cool', 'party', 'wave', 'think', 'nervous', 'worried', 'sad', 'cry', 'sob', 'puddle']) {
    for (const melt of [0, 4, 9]) {
      const n = snowman({ face, melt });
      ok(n.querySelector('svg') && !/NaN|undefined|null/.test(n.innerHTML), `${face}/${melt} draws cleanly`);
    }
  }
  ok(snowman({ face: 'puddle', melt: 9 }).textContent.includes('help'), 'the help sign');
  ok(!snowman({ face: 'sad', melt: 3 }).textContent.includes('help'));
  eq(snowman({ face: 'happy' }).getAttribute('aria-hidden'), 'true', 'decorative for screen readers');
});

test('Flurry: sized by height, cropped to what is drawn, never too wide', async () => {
  const { snowman, frame } = await import('../js/mascot.js');
  const px = (n, k) => parseInt(n.style[k], 10);
  const stand = snowman({ face: 'happy', size: 80 }), pud = snowman({ face: 'puddle', melt: 8, size: 80 });
  eq(px(stand, 'height'), 80); ok(px(stand, 'width') < 80, 'standing is taller than wide');
  ok(px(pud, 'width') > px(stand, 'width') * 1.5, 'a puddle spreads sideways instead of shrinking');
  const capped = snowman({ face: 'puddle', melt: 7, size: 100, maxWidth: 120 });
  eq(px(capped, 'width'), 120); ok(px(capped, 'height') < 100, 'width cap scales him down');
  ok(frame('happy', 0).top > frame('party', 0).top, 'no empty room above a plain snowman');
  ok(frame('puddle', 7).height < frame('happy', 0).height / 1.5, 'puddle frame is cropped');
});

test('Flurry: switched off means gone everywhere', async () => {
  const { buddy, hero } = await import('../js/mascot.js');
  const data = await import('../js/data.js');
  const s = data.getSettings(), before = s.mascot;
  try {
    s.mascot = false;                                   // in memory only — nothing is saved
    eq([buddy({ face: 'happy', quip: 'x' }), hero({ face: 'happy' })], [null, null]);
    s.mascot = true;
    ok(buddy({ face: 'happy', quip: 'x' }).querySelector('.snowman'));
  } finally { s.mascot = before; }
});

let passed = 0;
for (const t of results) {
  const li = document.createElement('li');
  try { await t.fn(); li.className = 'pass'; li.textContent = '✓ ' + t.name; passed++; }
  catch (e) { li.className = 'fail'; li.textContent = '✗ ' + t.name; const pre = document.createElement('pre'); pre.textContent = e.message; li.appendChild(pre); }
  out.appendChild(li);
}
const s = document.getElementById('summary');
s.textContent = `${passed} / ${results.length} passed`;
s.className = passed === results.length ? 'pass' : 'fail';
window.__testResult = { passed, total: results.length };
</script>
